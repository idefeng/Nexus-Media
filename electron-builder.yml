appId: com.nexus.media
productName: Nexus Media
copyright: Copyright © 2026 Nexus Team

directories:
  output: release
  buildResources: build

files:
  - "**/*"
  - "!**/*.ts"
  - "!*.map"
  - "!package-lock.yaml"
  - "!pnpm-lock.yaml"
  - "!src"
  - "!docs"
  - "!.git"
  - "!.gemini"
  - from: dist
    to: .
  - from: dist-electron
    to: .

extraResources:
  - from: ai_engine
    to: ai_engine
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: database
    to: database

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: "${productName}-Setup-${version}.${ext}"
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Nexus Media"
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png
  installerHeaderIcon: build/icon.png
  deleteAppDataOnUninstall: false
  runAfterFinish: true

asarUnpack:
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/ffmpeg-static/**/*"
  - "ai_engine/**/*"
